services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Bind-mounted so the index survives container recreation/removal -
      # migrated from the old volume-less standalone `qdrant` container via
      # `docker cp qdrant:/qdrant/storage/. ./qdrant_storage/`.
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: elog-semantic-search:latest
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    environment:
      QDRANT_HOST: qdrant
      MODEL_PATH: /app/ElogSemanticSearch/models/mxbai-embed-large-v1
      COLLECTION_NAME: Elog_collection_1024_METADATA
      # Second embedding model, loaded alongside mxbai for A/B comparison via
      # the "model" field of /api/search.
      MPNET_MODEL_PATH: /app/ElogSemanticSearch/models/all-mpnet-base-v2
      MPNET_COLLECTION_NAME: Elog_collection_768_METADATA
      AD_COLLECTION_NAME: Elog_collection_768_AD
    volumes:
      # Bind-mounted (not COPYed into the image) so swapping embedding
      # models doesn't require a rebuild.
      - ./ElogSemanticSearch/models:/app/ElogSemanticSearch/models:ro
    restart: unless-stopped
