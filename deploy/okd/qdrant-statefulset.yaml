apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
spec:
  # StatefulSet rather than Deployment because Qdrant owns the files on its
  # volume: it must be the only process writing them. On a node partition a
  # Deployment eventually assumes the pod is gone and starts a replacement,
  # which can leave the original running on the unreachable node with the
  # same volume mounted. A StatefulSet refuses to start the replacement until
  # the old pod is confirmed deleted - Qdrant stays down instead of risking
  # two writers.
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          # Pinned to the version the local index was built and tested with
          # (storage format: collections 0.4.2, segments 0.6.0). Qdrant
          # upgrades the on-disk format in place and won't downgrade, so let
          # a restart pull a newer release and the data can't be rolled back.
          image: qdrant/qdrant:v1.17.1
          ports:
            - name: http
              containerPort: 6333
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            # Single collection: Elog_collection_1024_METADATA is ~593M today.
            storage: 10Gi
        storageClassName: ceph-csi-cephfs-sc-sa-ifdata
