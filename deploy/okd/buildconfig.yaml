apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: elog-semantic-search
spec:
  source:
    # The cluster clones the repo itself, so an image is always traceable to
    # a commit rather than to whatever happened to be in a laptop's working
    # tree. Needs the repo to be public; otherwise add a token in
    # sourceSecret.
    type: Git
    git:
      uri: https://github.com/Li-Jiaoyang97/elog-smart-search-sbnd.git
      ref: feature/okd-deploy
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      # Builds land on :latest, and deploy/okd/build.sh immediately tags the
      # result with the commit SHA it was built from. OKD substitutes nothing
      # in this field and start-build has no --to, so the commit tag has to be
      # applied after the build rather than named here. Deployments reference
      # a SHA tag, never :latest, so a restart can't quietly change versions.
      kind: ImageStreamTag
      name: elog-semantic-search:latest
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      # pip resolving torch and friends is the memory-hungry part; the OPA
      # webhook requires all four values regardless.
      cpu: "2"
      memory: 4Gi
