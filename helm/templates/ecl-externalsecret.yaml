{{- if .Values.eclCredentials.externalSecret.enabled }}
{{- $es := .Values.eclCredentials.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.eclCredentials.secretName }}
  labels:
    {{- include "elog-search.labels" . | nindent 4 }}
spec:
  # The ECL password belongs to SBND, has no expiry and will be needed
  # indefinitely, so it lives in Vault rather than in a hand-made Secret that
  # only exists in one cluster and in nobody's notes.
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ required "eclCredentials.externalSecret.storeRef.name is required when the ExternalSecret is enabled - ask the okdprod1 admins for the ClusterSecretStore name" $es.storeRef.name }}
    kind: {{ $es.storeRef.kind }}
  target:
    # ESO creates and owns this Secret; the CronJob reads it by name.
    name: {{ .Values.eclCredentials.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.eclCredentials.usernameKey }}
      remoteRef:
        key: {{ required "eclCredentials.externalSecret.vaultPath is required when the ExternalSecret is enabled" $es.vaultPath }}
        property: {{ $es.usernameProperty }}
    - secretKey: {{ .Values.eclCredentials.passwordKey }}
      remoteRef:
        key: {{ $es.vaultPath }}
        property: {{ $es.passwordProperty }}
{{- end }}
